server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vendored Three.js rarely changes; cache it longer than app code.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # App code changes with every deploy: revalidate (ETag) so phones pick it up immediately.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
