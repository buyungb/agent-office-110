server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Docker's DNS, resolved per request: nginx still starts (and the office still works) if the bridge is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Live data and admin settings. SSE needs buffering off and a long read timeout.
    location /api/ {
        set $bridge http://bridge:8080;
        proxy_pass $bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }

    # The WhatsApp gateway calls the bridge directly on the private network; never from outside.
    location /hooks/ {
        return 404;
    }

    # Vendored Three.js rarely changes; cache it longer than app code.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # App code changes with every deploy: revalidate (ETag) so phones pick it up immediately.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
