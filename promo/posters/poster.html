<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrangPinter posters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--o:#ff7a1a;--o2:#ffb066;--navy:#0b1220;--ink:#f3f6ff;--muted:#b6c2de}
  *{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Nunito,sans-serif}
  .poster{position:relative;overflow:hidden;background:var(--navy)}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0b1220f2 0%,#0b1220b0 24%,#0b122000 44%,#0b122000 58%,#0b1220d0 78%,#0b1220 100%)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;padding:72px}
  .logo{display:flex;align-items:center;gap:16px;font:700 40px Fredoka,sans-serif}
  .logo .m{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--o);color:var(--navy);font-size:40px}
  .logo .by{font:700 18px Nunito;color:var(--muted);margin-left:auto;letter-spacing:.5px}
  h1{font:700 84px/1.02 Fredoka,sans-serif;margin:34px 0 0;letter-spacing:-1.5px;text-shadow:0 4px 30px #0009}
  h1 em,h2 em{font-style:normal;color:var(--o)}
  h2{font:700 56px/1.08 Fredoka,sans-serif;margin:24px 0 0;letter-spacing:-1px}
  .sub{font:700 30px/1.3 Nunito;color:#dfe7fb;margin-top:22px;max-width:860px;text-shadow:0 2px 14px #000a}
  .spacer{flex:1}
  .feats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
  .feat{background:#121b2ecc;border:2px solid #ff7a1a66;border-radius:16px;padding:12px 18px;font:800 22px Nunito;backdrop-filter:blur(6px)}
  .cta{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .btn{background:var(--o);color:#1a0d02;font:700 36px Fredoka;border-radius:22px;padding:18px 30px;box-shadow:0 10px 40px #ff7a1a55}
  .handle{font:700 22px Nunito;color:var(--muted);text-align:right}
  .chat{display:grid;gap:12px;max-width:620px;margin-top:34px}
  .chat .head{justify-self:start;background:#1f8a4cee;border-radius:14px;padding:9px 16px;font:800 20px Nunito}
  .msg{background:#f4fff4;color:#11251a;border-radius:20px 20px 20px 6px;padding:12px 18px;font:700 24px/1.25 Nunito;box-shadow:0 8px 24px #0008}
  .msg b{display:block;font:800 16px Nunito;color:#1f8a4c}
  .note{font:700 20px Nunito;color:var(--muted);margin-top:14px}
  .tiers{display:grid;gap:20px;margin-top:36px}
  .tier{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 18px;background:#121b2e;border:2px solid #2b3b52;border-radius:24px;padding:24px 28px}
  .tier.hot{border-color:var(--o);box-shadow:0 0 0 4px #ff7a1a33;background:linear-gradient(135deg,#1d1610,#121b2e)}
  .tier h3{margin:0;font:700 36px Fredoka}.tier .price{font:700 38px Fredoka;color:var(--o);text-align:right}
  .tier p{grid-column:1/-1;margin:0;font:700 21px/1.35 Nunito;color:#c9d4ee}
  .tier .tag{display:inline-block;background:var(--o);color:#1a0d02;font:800 16px Nunito;border-radius:10px;padding:4px 10px;margin-left:12px;vertical-align:middle}
  .early{margin-top:22px;font:800 26px Nunito;color:var(--o2)}
  .big{font:700 150px/0.95 Fredoka;letter-spacing:-4px;color:var(--o);text-shadow:0 0 60px #ff7a1a66}
  .date{display:inline-block;margin-top:26px;border:3px solid var(--o);border-radius:20px;padding:12px 24px;font:700 40px Fredoka}
</style></head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search), id = P.get('p') || 'p1', bg = P.get('bg') || '';
const logo = `<div class="logo"><span class="m">O</span>OrangPinter<span class="by">by APLINDO</span></div>`;
const cta = (text = 'Komen <b>KANTOR</b>') => `<div class="cta"><div class="btn">${text}</div><div class="handle">@orangpinter<br>orangpinter.id</div></div>`;
const posters = {
  p1: [1080, 1350, `${logo}<h1>Kantor kamu,<br><em>versi 3D</em>,<br>hidup 24 jam</h1><div class="sub">Lihat tim dan AI agent bekerja — langsung dari grup WhatsApp.</div><div class="spacer"></div><div class="feats"><span class="feat">💬 Chat grup jadi bubble</span><span class="feat">☕ Jadwal ngopi & rapat</span><span class="feat">🕌 Sholat berjamaah</span><span class="feat">⚙️ Atur tim tanpa coding</span></div>${cta('Komen <b>KANTOR</b> · demo gratis')}`],
  p2: [1080, 1350, `${logo}<h2>Grup WhatsApp tim<br>jadi <em>kantor yang hidup</em></h2><div class="chat"><span class="head">💬 Tim Produk</span><div class="msg"><b>Arka</b>Eval RAG semalam naik 4% 🚀</div><div class="msg"><b>Sekar</b>otw ngopi dulu yaa ☕</div></div><div class="note">…dan Sekar beneran jalan ke pantry. Isi pesan tidak disimpan.</div><div class="spacer"></div>${cta()}`],
  p3: [1080, 1350, `${logo}<h2>Pilih paket <em>kantormu</em></h2><div class="tiers"><div class="tier"><h3>Starter</h3><div class="price">Rp 499rb</div><p>Kantor 3D 12 ruangan, jadwal harian otomatis, ganti tim & merek sendiri.</p></div><div class="tier hot"><h3>Pro<span class="tag">TERLARIS</span></h3><div class="price">Rp 1,99jt</div><p>+ WhatsApp live (login QR), bubble chat, editor tim & peran, panduan deploy.</p></div><div class="tier"><h3>Done-for-you</h3><div class="price">mulai 7,5jt</div><p>+ desain sesuai brand, setup server & WhatsApp, dukungan 30 hari.</p></div></div><div class="early">🔥 Early bird 30% untuk 50 pembeli pertama</div><div class="spacer"></div>${cta('DM <b>KANTOR</b>')}`],
  p4: [1080, 1920, `<div style="height:180px"></div>${logo}<div class="spacer"></div><div class="big">LAUNCH!</div><h2>Kantor AI 3D yang hidup<br>dari <em>grup WhatsApp</em> tim</h2><div class="date">28 Oktober</div><div style="height:60px"></div>${cta('Tap link · lihat demo')}<div style="height:250px"></div>`],
  p5: [1080, 1920, `<div style="height:180px"></div>${logo}<h2 style="margin-top:60px">Mau kantor kayak gini<br>pakai <em>nama timmu</em>?</h2><div class="chat"><span class="head">💬 DM @orangpinter</span><div class="msg"><b>Kamu</b>KANTOR</div><div class="msg" style="background:#fff3e8"><b style="color:#c25200">OrangPinter</b>Siap! Ini link demo live-nya 👇</div></div><div class="spacer"></div>${cta('Balas <b>KANTOR</b>')}<div style="height:250px"></div>`],
  p6: [1080, 1080, `${logo}<h2>Kantor AI 3D untuk<br><em>tim & agency</em></h2><div class="sub">Chat WhatsApp jadi aktivitas visual. Atur tim tanpa coding.</div><div class="spacer"></div>${cta('DM <b>KANTOR</b> · demo gratis')}`],
};
const [w, h, html] = posters[id];
document.getElementById('root').innerHTML = `<div class="poster" style="width:${w}px;height:${h}px">${bg ? `<div class="bg" style="background-image:url('${bg}')"></div><div class="shade"></div>` : ''}<div class="content">${html}</div></div>`;
document.body.dataset.size = `${w}x${h}`;
</script>
</body></html>
