<!doctype html><html lang="id"><meta charset="utf-8"><title>Schedule QA</title>
<style>body{margin:0;padding:16px;background:#0f1724;color:#e6eef8;font:13px system-ui}h1{font-size:18px}table{border-collapse:collapse;margin:12px 0}td,th{border:1px solid #2b3b52;padding:3px 6px;vertical-align:top}th{background:#16223a;position:sticky;top:0}.work,.meeting,.oncall{color:#7dffa0}.coffee,.lunch{color:#ffd27a}.prayer{color:#c9a8ff}.off{color:#8091a8}#result{padding:8px 12px;border-radius:8px;display:inline-block}.passed{background:#1f4d2e}.failed{background:#5a1f26}pre{white-space:pre-wrap;color:#ff9aa5}a{color:#7fe9ff}</style>
<script type="importmap">{"imports":{"three":"/dist/vendor/three.module.js"}}</script>
<h1>Jadwal agent &amp; validasi jalur <a href="/dist/">Kantor</a></h1>
<div id="result">Menjalankan…</div><pre id="errors"></pre>
<table id="table"></table>
<script type="module">
import * as THREE from 'three';
import {TEAM} from '/dist/team.js';
import {planFor,seatPlan,seatKey,fmt,PRAYERS,simRate} from '/dist/schedule.js';
import {buildWorld,ROOMS} from '/dist/rooms.js';
import {sampleRoute} from '/dist/nav.js';
const errors=[];
// Timetable.
const times=[...new Set(TEAM.flatMap(p=>planFor(p).map(b=>b.start)))].sort((a,b)=>a-b);
const table=document.querySelector('#table');
table.innerHTML=`<tr><th>Jam</th>${TEAM.map(p=>`<th>${p.short}<br><small>${p.role}</small></th>`).join('')}</tr>`+times.map(t=>`<tr><td>${fmt(t)}</td>${TEAM.map(p=>{const b=planFor(p).find(b=>b.start===t);return `<td class="${b?.kind||''}">${b?b.label:''}</td>`;}).join('')}</tr>`).join('');
// Every block must start before it ends, and everyone must reach the mushalla before iqamah.
const world=buildWorld(new THREE.Scene());const seats=seatPlan();
for(const p of TEAM)for(const b of planFor(p)){if(!(b.end>b.start))errors.push(`${p.id}: empty block at ${fmt(b.start)}`);if(!world.spots.get(seatKey(seats.get(p.id),b)))errors.push(`${p.id}: no seat for ${b.place}/${b.kind}`);}
const used=new Map();for(const p of TEAM){for(const b of planFor(p)){const key=seatKey(seats.get(p.id),b);if(key.startsWith('parking'))continue;for(let m=b.start;m<b.end;m+=1){const k=`${key}@${m}`;if(used.has(k)&&used.get(k)!==p.id&&!key.startsWith('dc'))errors.push(`seat clash ${key} at ${fmt(m)}: ${used.get(k)} & ${p.id}`);used.set(k,p.id);}}}
// Walls: a route may only enter or leave a walled room (or the sport fence) through its door gap.
const rects=[...ROOMS.filter(r=>r.w),{id:'sport',x:19,z:8,w:25,d:11,doors:[{side:'back',at:-10}]}];
const roomAt=(x,z)=>rects.find(r=>Math.abs(x-r.x)<r.w/2-.03&&Math.abs(z-r.z)<r.d/2-.03)||null;
const nearDoor=(r,x,z)=>r.doors.some(d=>{const dz=r.z+(d.side==='front'?r.d/2:-r.d/2);return Math.abs(x-(r.x+d.at))<.66&&Math.abs(z-dz)<.35;});
let routes=0,longest=0;
for(const p of TEAM){const plan=planFor(p);for(let i=1;i<plan.length;i++){
  const a=world.spots.get(seatKey(seats.get(p.id),plan[i-1])),b=world.spots.get(seatKey(seats.get(p.id),plan[i]));if(a.key===b.key)continue;
  const r=world.nav.route(a,b);routes++;longest=Math.max(longest,r.length);
  let prev=roomAt(r.points[0][0],r.points[0][1]);const visited=new Set();
  for(let d=0;d<=r.length;d+=.05){const s=sampleRoute(r,d),cur=roomAt(s.x,s.z);if(cur)visited.add(cur.id);
    if(cur!==prev){const room=cur||prev;if(!nearDoor(room,s.x,s.z)){errors.push(`${p.id} ${fmt(plan[i].start)} ${a.key}→${b.key} crosses ${room.id} wall at ${s.x.toFixed(2)},${s.z.toFixed(2)}`);break;}prev=cur;}}
  for(const id of visited)if(id!==a.roomId&&id!==b.roomId)errors.push(`${p.id} ${a.key}→${b.key} passes through ${id}`);
}}
// Arrival before iqamah at simulated walking speed (8 m per simulated minute).
for(const pr of Object.values(PRAYERS))for(const p of TEAM){const plan=planFor(p),i=plan.findIndex(b=>b.prayer===pr.id);if(i<0)continue;const a=world.spots.get(seatKey(seats.get(p.id),plan[i-1])),b=world.spots.get(seatKey(seats.get(p.id),plan[i]));const arrive=plan[i].start+world.nav.route(a,b).length/8;if(arrive>pr.iqamah)errors.push(`${p.id} late for ${pr.name}: ${fmt(arrive)}`);}
document.querySelector('#result').textContent=`${errors.length?'GAGAL':'LULUS'} · ${routes} jalur dicek · terpanjang ${longest.toFixed(1)} m`;
document.querySelector('#result').className=errors.length?'failed':'passed';document.querySelector('#errors').textContent=errors.join('\n');
document.body.dataset.tests=errors.length?'failed':'passed';document.body.dataset.errors=JSON.stringify(errors);
</script></html>
