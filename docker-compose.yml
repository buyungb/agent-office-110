services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published ports: Dokploy's Traefik routes to the container on port 80.
    # Add the domain in Dokploy (Domains tab → service "web", port 80).
    expose:
      - "80"
    # Traefik can only reach containers on Dokploy's shared network.
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
